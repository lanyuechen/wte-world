# 下厨房关键字导入（YAML）
# 每组：labels = 写入菜谱的标签；names = 搜索关键字列表
# 每个关键字会搜索下厨房，优先标题匹配，再取「人做过」最多的菜谱

- labels:
    - 炒菜
  names:
    - 家常土豆丝
    - 小炒西蓝花
    - 小炒菜花
    - 小炒牛肉
    - 蒜薹炒鸡蛋
    - 蒜薹炒肉
    - 尖椒肉丝
    - 尖椒炒鸡蛋
    - 西红柿炒鸡蛋
    - 西葫芦炒鸡蛋
    - 清炒茼蒿
    - 清炒空心菜
    - 家常豆腐
    - 葱炒豆腐
- labels:
    - 炖菜
  names:
    - 炖大白菜
    - 土豆茄子炖豆角
    - 炖排骨
- labels:
  - 红烧
  names:
    - 红烧排骨
    - 红烧肉
    - 红烧鱼
    - 把子肉

- labels:
    - 主食
  names:
    - 焖面
    - 打卤面
    - 小笼包
    - 饺子
    - 烙饼
    - 馅饼
- labels:
    - 汤/粥
  names:
    - 西红柿鸡蛋汤
    - 紫菜蛋花汤
    - 棒子面粥
    - 小米粥